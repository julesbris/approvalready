# Production stack for a single Kamatera Ubuntu host. See docs/DEPLOY_KAMATERA.md.
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
#
# Network design:
#   edge  - proxy, web, api, worker, scheduler, clamav. Normal bridge (outbound internet allowed).
#   data  - internal-only bridge (no route to the internet) for db and redis.
# Only the proxy publishes ports. PostgreSQL and Redis publish nothing.
name: approvalready

x-defaults: &defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

x-api-env: &api-env
  APP_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  APP_VERSION: ${APP_VERSION:-0.1.0}
  GIT_SHA: ${GIT_SHA:-unknown}
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
  # The application role (non-owner, subject to row-level security). Created and kept in
  # sync by the migrate service; the owner credentials below are given to migrate only.
  DATABASE_URL: postgresql+psycopg://${APP_DB_USER:-approvalready_app}:${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}@db:5432/${POSTGRES_DB:?}
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
  CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
  FORWARDED_ALLOW_IPS: "*" # only Caddy and web can reach the API (no published port)
  WEB_BASE_URL: https://app.${PRIMARY_DOMAIN:?}
  EMAIL_PROVIDER: smtp
  EMAIL_FROM: ${EMAIL_FROM:?EMAIL_FROM is required}
  SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
  # Documents (Milestone 6). Files go to the "uploads" volume unless STORAGE_BACKEND=s3.
  STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
  STORAGE_LOCAL_ROOT: /data/uploads
  STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-}
  STORAGE_S3_REGION: ${STORAGE_S3_REGION:-}
  STORAGE_S3_ENDPOINT_URL: ${STORAGE_S3_ENDPOINT_URL:-}
  STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID:-}
  STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY:-}
  UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-20}
  MALWARE_SCANNER: clamav
  CLAMAV_HOST: clamav
  # Address, lot and plan, overlay and vessel lookups from free government sources.
  PROPERTY_FACTS_PROVIDER: ${PROPERTY_FACTS_PROVIDER:-qld_spatial}
  LOOKUPS_ENABLED: ${LOOKUPS_ENABLED:-true}
  AMSA_VESSEL_LIST_URL: ${AMSA_VESSEL_LIST_URL:-}

x-api-image: &api-image
  image: ${IMAGE_PREFIX:-approvalready}/api:${IMAGE_TAG:-latest}
  build: ./apps/api

services:
  proxy:
    <<: *defaults
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PRIMARY_DOMAIN: ${PRIMARY_DOMAIN:?PRIMARY_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }

  web:
    <<: *defaults
    image: ${IMAGE_PREFIX:-approvalready}/web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
    read_only: true
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache
    cap_drop: [ALL]
    networks: [edge]
    depends_on:
      api: { condition: service_healthy }

  api:
    <<: [*defaults, *api-image]
    command: ["api"]
    environment: *api-env
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - uploads:/data/uploads
    cap_drop: [ALL]
    networks: [edge, data]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  migrate:
    <<: *api-image
    command: ["migrate"]
    environment:
      <<: *api-env
      MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?}
    restart: "no"
    security_opt:
      - no-new-privileges:true
    networks: [data]
    depends_on:
      db: { condition: service_healthy }

  worker:
    <<: [*defaults, *api-image]
    command: ["worker"]
    environment: *api-env
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - uploads:/data/uploads
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 60s
      timeout: 15s
      retries: 3
    networks: [edge, data]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  scheduler:
    <<: [*defaults, *api-image]
    command: ["scheduler"]
    environment: *api-env
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    healthcheck:
      disable: true
    networks: [edge, data]
    depends_on:
      redis: { condition: service_healthy }

  # Malware scanner for uploads. The worker streams each file to clamd over the edge network
  # (no shared files). Downloads virus signatures on start, which takes a few minutes and
  # about 1.5 GB of memory; scans wait and retry until it is ready.
  clamav:
    <<: *defaults
    image: clamav/clamav:1.4
    volumes:
      - clamav_db:/var/lib/clamav
    networks: [edge]

  db:
    <<: *defaults
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./backups:/backups
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [data]

  redis:
    <<: *defaults
    image: redis:8-alpine
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?}
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - noeviction
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [data]

networks:
  edge: {}
  data:
    internal: true

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
  uploads: # uploaded and generated documents: include it in backups
  clamav_db:
