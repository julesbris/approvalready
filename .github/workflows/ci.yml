name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: approvalready
          POSTGRES_PASSWORD: approvalready
          POSTGRES_DB: approvalready_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U approvalready -d approvalready_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://approvalready:approvalready@localhost:5432/approvalready_test
      TEST_REDIS_URL: redis://localhost:6379/15
      REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest -q tests ../../tests/infrastructure
      - name: OpenAPI schema is committed and current
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code -- ../../packages/shared-types/openapi.json

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generated API types match the committed OpenAPI schema
        run: |
          npm run generate --workspace @approvalready/shared-types
          git diff --exit-code -- packages/shared-types/src/api.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web

  images:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t approvalready/api:ci apps/api
      - run: docker build -f apps/web/Dockerfile -t approvalready/web:ci .
      - name: Validate compose files
        run: |
          docker compose config -q
          docker compose -f docker-compose.prod.yml --env-file .env.example config -q
