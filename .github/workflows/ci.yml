name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18-alpine
        env:
          POSTGRES_USER: approvalready
          POSTGRES_PASSWORD: approvalready
          POSTGRES_DB: approvalready_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U approvalready -d approvalready_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: mirror.gcr.io/library/redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://approvalready:approvalready@localhost:5432/approvalready_test
      TEST_REDIS_URL: redis://localhost:6379/15
      REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest -q tests ../../tests/infrastructure
      - name: OpenAPI schema is committed and current
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code -- ../../packages/shared-types/openapi.json

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generated API types match the committed OpenAPI schema
        run: |
          npm run generate --workspace @approvalready/shared-types
          git diff --exit-code -- packages/shared-types/src/api.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web

  e2e:
    # Browser (Playwright) end-to-end tests: the partner journey against the API, a Celery
    # worker and the production web build, run as host processes by scripts/e2e.sh.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18-alpine
        env:
          POSTGRES_USER: approvalready
          POSTGRES_PASSWORD: approvalready
          POSTGRES_DB: approvalready
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U approvalready -d approvalready"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: mirror.gcr.io/library/redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: uv sync --frozen
        working-directory: apps/api
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      # Recreates the approvalready_e2e database, migrates and starts the stack, then seeds
      # it and runs Playwright: the partner journey and the Content Security Policy check.
      - name: Start the stack
        run: scripts/e2e.sh up
      - name: Partner journey in the browser
        run: scripts/e2e.sh test
      # OWASP ZAP baseline (passive) scan of the web app on the same stack. Accepted findings
      # are listed with reasons in .zap/rules.tsv; any other warning fails the job.
      - name: ZAP baseline scan
        run: |
          mkdir -p zap-report && chmod 777 zap-report && cp .zap/rules.tsv zap-report/
          docker run --rm --network host -v "$PWD/zap-report:/zap/wrk:rw" \
            mirror.gcr.io/zaproxy/zap-stable zap-baseline.py \
            -t http://127.0.0.1:3000 -m 2 -j -c rules.tsv -r zap-report.html
      - name: Stop the stack
        if: always()
        run: scripts/e2e.sh down
      - name: Upload the Playwright report, traces and stack logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-and-zap-reports
          path: |
            apps/web/e2e/playwright-report/
            apps/web/e2e/test-results/
            .e2e/*.log
            zap-report/
          retention-days: 14
          if-no-files-found: ignore

  security:
    # Known vulnerabilities in what ships: the API's locked runtime dependencies (pip-audit,
    # PyPI advisories) and the web app's production npm packages (npm audit).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Python dependency audit
        working-directory: apps/api
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit -r "$RUNNER_TEMP/requirements.txt" --require-hashes --disable-pip
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  images:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v5
      # Runners hit Docker Hub's anonymous pull rate limit: fetch the base images through
      # Google's mirror and tag them with the names the Dockerfiles use, so the build (on the
      # default docker driver, which uses local images) doesn't pull them again.
      - name: Pull base images through the Docker Hub mirror
        run: |
          for image in library/python:3.14-slim library/node:22-alpine; do
            docker pull "mirror.gcr.io/$image"
            docker tag "mirror.gcr.io/$image" "${image#library/}"
          done
      # BUILDKIT_SYNTAX fetches the Dockerfile frontend from the mirror too.
      - run: >-
          docker build --build-arg BUILDKIT_SYNTAX=mirror.gcr.io/docker/dockerfile:1.7
          -t approvalready/api:ci apps/api
      - run: >-
          docker build --build-arg BUILDKIT_SYNTAX=mirror.gcr.io/docker/dockerfile:1.7
          -f apps/web/Dockerfile -t approvalready/web:ci .
      - name: Validate compose files
        run: |
          docker compose config -q
          docker compose -f docker-compose.prod.yml --env-file .env.example config -q
