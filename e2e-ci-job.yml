  e2e:
    # Browser (Playwright) end-to-end tests: the partner journey against the API, a Celery
    # worker and the production web build, run as host processes by scripts/e2e.sh.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18-alpine
        env:
          POSTGRES_USER: approvalready
          POSTGRES_PASSWORD: approvalready
          POSTGRES_DB: approvalready
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U approvalready -d approvalready"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: mirror.gcr.io/library/redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: uv sync --frozen
        working-directory: apps/api
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      # Recreates the approvalready_e2e database, migrates, starts the stack, seeds, runs
      # Playwright and stops everything again.
      - name: Partner journey in the browser
        run: scripts/e2e.sh run
      - name: Upload the Playwright report, traces and stack logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/e2e/playwright-report/
            apps/web/e2e/test-results/
            .e2e/*.log
          retention-days: 14
          if-no-files-found: ignore
